# version: '3'
services:
  db:
    image: postgres:14.2
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: dev.txt
    restart: always
    ports:
      - 8002:8000
    env_file: .env
    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /app/docker/entrypoint.sh /tmp/entrypoint.sh
        sed -i 's/\r$//' /tmp/entrypoint.sh
        chmod +x /tmp/entrypoint.sh
        exec /tmp/entrypoint.sh "$@"
      - --
    command: sh -c "cp pre-commit.example .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit && ./manage.py migrate && ./manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app
    depends_on:
      - db

  # queue:
